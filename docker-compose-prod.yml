version: "3.9"
services:
  trivista-loan-app:
    build:
      context: .
      dockerfile: Trivista.LoanApp.Api/Dockerfile
    image: loan-app:latest
    container_name: trivista-loan-app 
    restart: unless-stopped
    ports:
      - 8090:80
    networks:
      - trivista_capital
    environment:
      - ASPNETCORE_ENVIRONMENT=Production

networks:
  trivista_capital:
    external: true
